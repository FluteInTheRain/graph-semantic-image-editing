[project]
name = "mmxai"
version = "0.1.0"
description = "Explainable text-to-image retrieval re-ranked with graph neural networks (CLIP + GNN + faithful path explanations)."
readme = "README.md"
requires-python = ">=3.11"
# Light default runtime deps: enough for configs, splits, metrics and tests.
# Heavy ML stacks live in dependency groups below (see docs/decisions/0006).
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[dependency-groups]
# Installed by plain `uv sync` (uv treats `dev` as a default group).
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
    "pre-commit>=4.0",
    "nbstripout>=0.8",
]
# CLIP feature extraction + vector search: `uv sync --group ml`
ml = [
    "torch>=2.4",
    "open-clip-torch>=2.29",
    "faiss-cpu>=1.9",
    "pillow>=10.0",
    "pandas>=2.2",
    "tqdm>=4.66",
]
# Graph models: `uv sync --group ml --group graph`
graph = [
    "torch-geometric>=2.6",
    "networkx>=3.3",
]
# Extra text encoders / KG linking helpers (optional).
nlp = [
    "sentence-transformers>=3.0",
]
# Notebook demo + optional small UI: `uv sync --group demo`
demo = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "gradio>=5.0",
]
# Optional training logs on Weights & Biases (ADR-0047): `--group tracking`
tracking = [
    "wandb>=0.19",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mmxai"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
