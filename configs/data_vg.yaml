# Visual Genome annotation files that scripts/setup.py downloads when missing.
# Source and hashes: data_cards/visual_genome.md. The CLIP features are not here: they come
# from the Kaggle notebook (docs/guides/chuan-bi-embedding-clip.md, section 2).
data_dir: data/visual_genome
files:
  # Needed to build the graph (concept vocabulary counted on train, ADR-0045). v1.4.
  - name: objects.json
    url: https://homes.cs.washington.edu/~ranjay/visualgenome/data/dataset/objects.json.zip
    sha256: 94238b6187c0ea1f97acc1fdaec106bd3dee12bb0f81b23dc8b07e9173514985
    required: true
  # Only lets scripts/run_pipeline.py print the query sentences. v1.2, as the features.
  # No hash recorded yet: none was taken when the features were made.
  - name: region_descriptions.json
    url: https://homes.cs.washington.edu/~ranjay/visualgenome/data/dataset/region_descriptions.json.zip
    sha256: null
    required: false
