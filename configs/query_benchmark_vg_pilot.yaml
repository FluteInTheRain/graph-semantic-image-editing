# Val PILOT of the query generator (ADR-0044): 5 pairs on val to check the rules and templates.
# Output goes to results/runs/ (gitignored); val queries never enter queries/ (ADR-0009).
# How to run: uv run python scripts/generate_queries.py --config configs/query_benchmark_vg_pilot.yaml
dataset: visual_genome
data_dir: data/visual_genome
objects_file: objects.json
relationships_file: relationships.json
split_file: splits/visual_genome/split_seed0.json
# Pilot on val: never look at test while tuning the rules.
split: val
seed: 0
# The task asks for a 5-pair pilot on val. All other values must equal the test config.
limit_pairs: 5
# Decision (ADR-0044, proposed): 2-hop chains only. The text templates support exactly 2 hops
#   (the loader enforces min_hops = max_hops = 2); more hops need new templates and a new decision.
min_hops: 2
max_hops: 2
# One pair per image spreads the benchmark over many images.
max_pairs_per_image: 1
# Decision (ADR-0044, proposed): drop a chain found in more than 25 test images:
#   too generic to review by hand. Fixed before any generation or retrieval result.
max_candidate_images: 25
# Names that do not point to a checkable object.
generic_names: [it, this, that, these, those, thing, things, something, object, objects,
                item, stuff, part, piece, side, area, one]
# Decision (ADR-0044, pilot val 2026-11-06, Thuat Nguyen): whitelist of predicates with a
#   hand-written verb phrase. Chosen from predicate frequencies on TRAIN only.
#   Dropped on purpose: has/have, of, with, by, for, and, at, from, belonging to, between, along.
predicate_templates:
  wearing: is wearing
  holding: is holding
  riding: is riding
  carrying: is carrying
  eating: is eating
  playing: is playing
  watching: is watching
  looking at: is looking at
  pulling: is pulling
  sitting on: is sitting on
  sitting in: is sitting in
  standing on: is standing on
  standing in: is standing in
  walking on: is walking on
  laying on: is lying on
  hanging on: is hanging on
  hanging from: is hanging from
  covering: is covering
  attached to: is attached to
  painted on: is painted on
  "on": is on
  on top of: is on top of
  in: is in
  inside: is inside
  under: is under
  above: is above
  behind: is behind
  in front of: is in front of
  next to: is next to
  near: is near
  beside: is beside
# Variants mapped to one canonical predicate (after stripping "is/are" and a trailing article).
predicate_aliases:
  wears: wearing
  holds: holding
  rides: riding
  carries: carrying
  eats: eating
  plays: playing
  watches: watching
  looks at: looking at
  pulls: pulling
  sits on: sitting on
  stands on: standing on
  lying on: laying on
  hangs on: hanging on
  inside of: inside
# Decision (ADR-0044): every chain needs at least one of these actions.
action_predicates: [wearing, holding, riding, carrying, eating, playing, watching, looking at,
                    pulling, sitting on, sitting in, standing on, standing in, walking on,
                    laying on, hanging on, hanging from, covering]
author: generator-template-v2
candidates_path: results/runs/query_pilot_val/visual_genome_candidates_val.jsonl
manifest_path: results/runs/query_pilot_val/query_review_manifest_val.csv
benchmark_path: results/runs/query_pilot_val/unused_benchmark.jsonl  # never built from val
# PDF Task 2: at least 20 queries = 10 direct/indirect pairs.
min_verified_pairs: 10
