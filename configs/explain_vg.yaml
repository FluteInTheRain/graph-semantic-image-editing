# Explanation evaluation (xAI, level 3) on Visual Genome (ADR-0016).
# Every value below is chosen on val only; test is run once with the final values (ADR-0009).
experiment: explain_vg
# The model chosen in results/tables/main.csv (one-layer GraphSAGE, ADR-0046); its weights
# and val-chosen alpha per seed are read from that config's model_dir.
ranking_config: configs/clip_graph_vg_lr1e4.yaml
eval_split: val
# Rule fixed before any run: draw num_queries query rows of the split at random with
# query_sample_seed, the same rows for every seed; explain the image CLIP + Graph ranks first.
num_queries: 20
query_sample_seed: 0
seeds: [0, 1, 2]
# Explainers compared on val; the one with the best characterization becomes the main one.
explainers: [occlusion, integrated_gradients, gnn_explainer]
# The ADR-0046 model: one layer, concept -> image edges stored in one direction only
# (ADR-0046 section 5). The run stops if the model says otherwise.
num_layers: 1
both_directions: false
# Explanation sizes compared on val.
top_m_options: [3, 5, 10]
# Chosen on val (statistics.choose_on_validation) and written here before test; test
# refuses to run while these are null.
main_explainer: integrated_gradients
top_m: 10
# Effects too small to show (float noise).
min_contribution: 1.0e-6
# Characterization weighs fidelity+ and 1 - fidelity- equally (GraphFramEx default).
plus_weight: 0.5
# Random control: same number of relations removed at random near the image.
random_repeats: 20
# Robust fidelity, Zheng et al. (ICLR 2024, arXiv 2310.01820): the paper uses
# "alpha1 = 1 - alpha2 = 0.1", i.e. remove each explanation relation with probability 0.1
# and add back each other relation with probability 0.9.
robust_remove_prob: 0.1
robust_add_back_prob: 0.9
robust_repeats: 20
# Integrated Gradients: steps along the path from no relations to all relations.
ig_steps: 50
# GNNExplainer: size and entropy weights are PyG's defaults. Unlike PyG (Adam, lr 0.01,
# 100 epochs), we take plain gradient steps with a larger rate and a start of N(1, 0.1).
gnn_explainer_epochs: 200
gnn_explainer_learning_rate: 1.0
gnn_explainer_size_weight: 0.005
gnn_explainer_entropy_weight: 1.0
output_dir: results/runs
