# Image-concept graph of Visual Genome with "contains" edges only (ADR-0045, status: Proposed).
# How to run: see the docstring of scripts/build_graph.py and docs/guides/xay-do-thi.md.
dataset: visual_genome
# objects.json v1.4 from the official Visual Genome download page (gitignored data/).
#   Decided by: qphulong, 2026-11-07.
data_dir: data/visual_genome
objects_file: objects.json
# Every image of this split gets a node; the vocabulary is counted on its train set only.
split_file: splits/visual_genome/split_seed0.json
# Decision (ADR-0045): keep a synset seen in >= 5 train images.
#   Why: a concept met in one image links no images together; 5 keeps ~3.9k concepts.
#   Proposed by Claude Code, 2026-11-07; not yet decided by the team.
min_train_images: 5
# Decision (ADR-0045): concept node vector = CLIP text embedding of this sentence.
#   Proposed by Claude Code, 2026-11-07; not yet decided by the team.
concept_prompt: "a photo of a {}"
# Must equal the model of the cached image embeddings, so both node types share one space.
model: ViT-B-32
pretrained: laion2b_s34b_b79k
device: auto
text_batch_size: 256
output_dir: artifacts/graphs/visual_genome/contains_v1
