# KG query benchmark for Visual Genome, test split (ADR-0057, status: Proposed).
# How to run: see the docstrings of scripts/generate_kg_queries.py and
# scripts/build_kg_query_benchmark.py.
# Every value below must be fixed on the val pilot BEFORE generating on test, and never
# changed after looking at retrieval results (PDF section 6, ADR-0009).
dataset: visual_genome
data_dir: data/visual_genome
objects_file: objects.json
relationships_file: relationships.json
split_file: splits/visual_genome/split_seed0.json
# Decision (ADR-0009): the benchmark points to test images only.
split: test
# ConceptNet edges filtered once by scripts/prepare_conceptnet.py (ADR-0057).
conceptnet_edges: artifacts/conceptnet/en_edges.tsv
# Same canonicalisation as ADR-0044, only for the activity predicates. VG writes
# "riding on a horse" for the same act as "riding a horse", so both count as riding.
predicate_aliases: {plays: playing, play: playing, playing with: playing,
                    rides: riding, ride: riding, riding on: riding,
                    flies: flying, fly: flying}
# Decision (Thuat Nguyen, 2026-11-15): the val pilot gave only 4 "playing" candidates, so
# riding and flying (horse, skateboard, kite, ...) join the activity group. Each predicate
# is its own comparison pool and is visited in this order.
activity_predicates: [playing, riding, flying]
# Predicates worded "A person playing tennis." (no article, "is played in" templates);
# every other activity predicate is worded "A person riding a horse." with object_templates.
play_predicates: [playing]
# Decision (ADR-0057, proposed): subjects that count as "a person".
person_synsets: [man.n.01, woman.n.01, boy.n.01, girl.n.01, child.n.01, person.n.01,
                 player.n.01, guy.n.01, lady.n.01, people.n.01, kid.n.01]
# Decision (ADR-0057, proposed): category words an indirect query may name.
category_words: [sport, game, activity, vehicle, animal, instrument, fruit, vegetable,
                 furniture, tool, food, toy, appliance, device, container, clothing]
# Verb phrase per ConceptNet fact kind, for activity and object concepts.
# Decision: "in", not "on"/"at": pilot val 2026-11-15 gave "played on a park".
activity_templates: {uses: uses, location: is played in, has: has, can: can}
object_templates: {uses: is used with, location: is found in, has: has, can: can}
# Decision (pilot val 2026-11-15): categories one plays directly ("playing a sport"); any other
# activity category is worded "playing with a toy" ("playing a toy" read badly).
activity_play_categories: [sport, game]
# Decision (pilot val 2026-11-15): too generic to be a hidden concept ("game" was chosen as the
# target of a pair). A target whose term is listed here is rejected.
excluded_concepts: [game, activity, sport, toy, thing, object, item, stuff]
# Number of property facts in an indirect query (besides the one category fact).
num_properties: 2
# Decision (pilot val 2026-11-15): ConceptNet weight-1 facts were often odd ("cable found at
# a back of computer"), so a property fact needs weight >= 2. IsA categories are not filtered.
min_fact_weight: 2.0
# Decision (ADR-0057, proposed): thresholds, fixed on the val pilot.
#   A concept needs enough TRAIN images to be a fair target, and a small answer set
#   in the queried split so a human can verify all of it.
min_train_images: 20
min_answer_images: 3
max_answer_images: 50
# Total over all activity predicates; raised from 10 so riding and flying can fill the group.
limit_activity_pairs: 12
limit_object_pairs: 20
author: kg-template-v1
candidates_path: queries/visual_genome_kg_candidates.jsonl
manifest_path: queries/query_review_manifest_kg.csv
benchmark_path: queries/visual_genome_kg_test.jsonl
# PDF Task 2: at least 20 queries = 10 direct/indirect pairs.
min_verified_pairs: 10
