# Optional local git hooks. Enable once per clone: `uv run pre-commit install`
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3  # keep in sync with ruff in uv.lock
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
        # Split files are required deliverables (PDF section 8), not data artifacts (ADR-0042).
        exclude: ^splits/
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
